<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="glanceGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00c4dd"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark rounded background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0a0e17" stroke="#00e5ff" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Subtle violet outer glow behind the eye -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="#8b5cf6" stroke-opacity="0.28" stroke-width="1.2"/>

  <!-- Eye group with neon cyan glow -->
  <g filter="url(#glow)">
    <!-- Iris (outer ring) -->
    <circle cx="32" cy="32" r="13" fill="none" stroke="url(#glanceGrad)" stroke-width="3"/>
    <!-- Violet pupil (solid, clearly violet) -->
    <circle cx="32" cy="32" r="7" fill="#8b5cf6"/>
    <!-- Pupil core -->
    <circle cx="32" cy="32" r="3.6" fill="#0a0e17"/>
    <!-- Highlight -->
    <circle cx="29.8" cy="29.8" r="2" fill="#e8f6ff" fill-opacity="0.95"/>
  </g>
</svg>
